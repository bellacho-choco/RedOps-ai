# ====================================================================
# REDOPS-AI - DOCKER COMPOSE ORCHESTRATION
# Multi-Service Architecture for Web Cockpit, CLI Matrix & Daemon
# ====================================================================

version: "3.9"

services:
  # 1. Web Cockpit & Swarm API Server
  redops-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redops-web
    command: ["python", "run.py", "--mode", "web"]
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - redops-net

  # 2. Interactive Terminal TUI Cockpit Service
  redops-cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redops-cli
    command: ["python", "run.py", "--mode", "tui"]
    stdin_open: true
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - TERM=xterm-256color
    volumes:
      - .:/app
    networks:
      - redops-net

  # 3. Go Ultra-Low Latency Micro-Daemon
  go-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redops-go-daemon
    working_dir: /app/go_daemon
    command: ["go", "run", "daemon.go"]
    ports:
      - "9090:9090"
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - redops-net

networks:
  redops-net:
    driver: bridge
